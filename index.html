<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Green Background Page</title>
  <meta name="description" content="A simple index.html with a green background" />
  <style>
    :root {
      --bg-green: #0f9d58; /* main green background */
      --card-bg: rgba(255,255,255,0.12);
      --text: #ffffff;
      --muted: rgba(255,255,255,0.85);
    }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(180deg, var(--bg-green) 0%, #0d8a4d 100%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      max-width: 900px;
      width: 100%;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.06);
    }

    h1 {
      margin: 0 0 0.5rem 0;
      font-size: clamp(1.5rem, 3vw, 2.25rem);
      line-height: 1.05;
    }

    p {
      margin: 0 0 1rem 0;
      color: var(--muted);
      font-size: 1rem;
    }

    .actions {
      margin-top: 1rem;
    }

    a.button {
      display: inline-block;
      background: #ffffff;
      color: var(--bg-green);
      padding: 0.6rem 1rem;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      box-shadow: 0 6px 18px rgba(0,0,0,0.12);
    }

    footer {
      margin-top: 1.25rem;
      font-size: 0.85rem;
      color: rgba(255,255,255,0.8);
    }

    @media (prefers-reduced-motion: no-preference) {
      .card { transform: translateY(-6px); transition: transform .35s ease; }
      .card:hover { transform: translateY(-2px); }
    }
  </style>
</head>
<body>
  <main class="card" role="main">
    <h1>Welcome — Green Background</h1>
    <p>This is a minimal starter <code>index.html</code> with a green background. Replace this content with your site or app markup.</p>

    <div class="actions">
      <a class="button" href="#" aria-label="Get started">Get started</a>
    </div>

    <footer>
      Created on 2026-01-22
    </footer>
  </main>
</body>
</html>
